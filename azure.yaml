# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: aks-ai-upgrade-agent
metadata:
    template: azd-init@1.31.2
services:
    af-foundry-agent:
        project: agent-framework-agent-with-foundry-toolbox-responses/src/agent-framework-agent-with-foundry-toolbox-responses
        host: containerapp
        language: python
        docker:
            path: Dockerfile
            remoteBuild: true
    aks-mcp:
        project: agent-framework-agent-with-foundry-toolbox-responses/src/aks-operations-mcp
        host: containerapp
        language: python
        docker:
            remoteBuild: true
resources:
    af-foundry-agent:
        type: host.containerapp
        port: 8088
    aks-mcp:
        type: host.containerapp
        port: 80
