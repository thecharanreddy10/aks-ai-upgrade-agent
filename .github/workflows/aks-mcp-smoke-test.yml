name: AKS MCP Smoke Test

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: MCP endpoint URL (optional override)
        required: false
        type: string
      subscriptionId:
        description: Azure subscription ID (optional override)
        required: false
        type: string
      resourceGroup:
        description: AKS resource group (optional override)
        required: false
        type: string
      clusterName:
        description: AKS cluster name (optional override)
        required: false
        type: string
      namespace:
        description: Namespace for pod and PDB checks (optional override)
        required: false
        type: string
  schedule:
    - cron: '0 */12 * * *'

jobs:
  validate-mcp-tools:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MCP_ENDPOINT: ${{ github.event.inputs.endpoint || vars.AKS_MCP_ENDPOINT }}
      MCP_SUBSCRIPTION_ID: ${{ github.event.inputs.subscriptionId || vars.AKS_SUBSCRIPTION_ID }}
      MCP_RESOURCE_GROUP: ${{ github.event.inputs.resourceGroup || vars.AKS_RESOURCE_GROUP }}
      MCP_CLUSTER_NAME: ${{ github.event.inputs.clusterName || vars.AKS_CLUSTER_NAME }}
      MCP_NAMESPACE: ${{ github.event.inputs.namespace || vars.AKS_NAMESPACE || 'default' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required pipeline variables
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:MCP_ENDPOINT)) { $missing += 'AKS_MCP_ENDPOINT (or workflow input endpoint)' }
          if ([string]::IsNullOrWhiteSpace($env:MCP_SUBSCRIPTION_ID)) { $missing += 'AKS_SUBSCRIPTION_ID (or workflow input subscriptionId)' }
          if ([string]::IsNullOrWhiteSpace($env:MCP_RESOURCE_GROUP)) { $missing += 'AKS_RESOURCE_GROUP (or workflow input resourceGroup)' }
          if ([string]::IsNullOrWhiteSpace($env:MCP_CLUSTER_NAME)) { $missing += 'AKS_CLUSTER_NAME (or workflow input clusterName)' }

          if ($missing.Count -gt 0) {
            Write-Error ("Missing required values: " + ($missing -join ', '))
            exit 1
          }

      - name: Run MCP smoke tests
        shell: pwsh
        run: |
          ./scripts/validate-aks-mcp-tools.ps1 `
            -Endpoint "$env:MCP_ENDPOINT" `
            -SubscriptionId "$env:MCP_SUBSCRIPTION_ID" `
            -ResourceGroup "$env:MCP_RESOURCE_GROUP" `
            -ClusterName "$env:MCP_CLUSTER_NAME" `
            -Namespace "$env:MCP_NAMESPACE"
